name: docker-smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t powershell-stakeholder .
      - name: List values
        run: docker run --rm powershell-stakeholder --list-values
      - name: JSON smoke
        run: docker run --rm powershell-stakeholder --output-format json --focus-family code_analyzer --seed 123
      - name: Experimental provider fail-fast
        run: |
          set +e
          docker run --rm powershell-stakeholder --experimental-provider local-demo
          status=$?
          test "$status" -eq 2
