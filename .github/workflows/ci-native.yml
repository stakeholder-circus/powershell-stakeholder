name: ci-native

on:
  workflow_call:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser
      - name: Run checks
        shell: pwsh
        run: |
          python3 scripts/validate_scaffold.py
          Invoke-Pester -Path tests -CI
          ./bin/powershell-stakeholder.ps1 --output-format json --focus-family code_analyzer --seed 123
