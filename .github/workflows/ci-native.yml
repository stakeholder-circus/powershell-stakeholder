name: ci-native

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.1.0 -Force -Scope CurrentUser
      - name: Run checks
        shell: pwsh
        run: |
          python3 scripts/validate_scaffold.py
          Invoke-Pester -Path tests -CI
          ./bin/powershell-stakeholder.ps1 --output-format json --focus-family code_analyzer --seed 123
