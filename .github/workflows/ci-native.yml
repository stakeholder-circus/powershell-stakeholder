name: ci-native

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 6.1.0 -Force -Scope CurrentUser
      - name: Run checks
        shell: pwsh
        run: |
          python3 scripts/validate_scaffold.py
          Invoke-Pester -Path tests -CI
          ./bin/powershell-stakeholder.ps1 --output-format json --focus-family code_analyzer --seed 123
