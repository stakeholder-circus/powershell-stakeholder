name: security-analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'bin/**'
  pull_request:
  schedule:
    - cron: '31 5 * * 3'

permissions:
  contents: read

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir zizmor==1.29.0
      - run: zizmor --offline --strict-collection .

  powershell-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $findings = @(Invoke-ScriptAnalyzer -Path bin -Recurse -Severity Error,Warning)
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings.Count -gt 0) {
            throw "PSScriptAnalyzer found $($findings.Count) issue(s)"
          }
